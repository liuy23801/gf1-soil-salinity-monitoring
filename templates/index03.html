        function showCountdownPopup() {
        // 创建一个遮罩层
        var mask = document.createElement('div');
        mask.style.position = 'fixed';
        mask.style.top = 0;
        mask.style.left = 0;
        mask.style.right = 0;
        mask.style.bottom = 0;
        mask.style.background = 'rgba(0, 0, 0, 0.5)';
        document.body.appendChild(mask);

        // 创建一个弹窗
        var popup = document.createElement('div');
        popup.style.position = 'fixed';
        popup.style.top = '50%';
        popup.style.left = '50%';
        popup.style.transform = 'translate(-50%, -50%)';
        popup.style.background = 'white';
        popup.style.padding = '20px';
        popup.style.borderRadius = '5px';
        popup.style.fontSize = '20px';
        popup.innerHTML = '预处理中，请稍后：<span id="countdown">8</span>秒';
        document.body.appendChild(popup);

        // 倒计时关闭弹窗
        var count = 5;
        setInterval(function() {
            count--;
            if (count >= 0) {
                document.getElementById('countdown').textContent = count;
            } else {
                document.body.removeChild(mask);
                document.body.removeChild(popup);
            }
         }, 1000);

        }

        function handleFiles(files) {
            var file = files[0];
            var formData = new FormData();
            formData.append('file', file);

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload', true);
            xhr.onload = function () {
                if (this.status == 200) {
                    alert(this.responseText);
                }
            };
            xhr.send(formData);
        }





    document.addEventListener('DOMContentLoaded', function () {
    const img = document.getElementById('tif-image');
    const canvas = document.getElementById('tif-canvas');
    const context = canvas.getContext('2d');

    img.onload = function () {
        const url = URL.createObjectURL(img.src);
        Tiff.initialize({
            TIFF: {
                initialize: function (buffer) {
                    return new Tiff({buffer: buffer});
                },
                is_big_endian: function () {
                    return false;
                },
                bytes_per_pixel: function () {
                    return 1;
                }
            }
        });

        Tiff.open(url, function (tiff) {
            const canvas = document.getElementById('tif-canvas');
            const image = tiff.getImage();
            const data = image.readRGBAImage();

            canvas.width = image.getWidth();
            canvas.height = image.getHeight();
            const context = canvas.getContext('2d');
            const imageData = context.createImageData(canvas.width, canvas.height);
            imageData.data.set(data);
            context.putImageData(imageData, 0, 0);
        });
    };
});
