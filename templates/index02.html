<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>地图数据可视化</title>

    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="stylesheet" href="/static/fonts/icomoon.css">
    <link href="https://js.arcgis.com/3.43/esri/themes/calcite/dijit/calcite.css" rel="stylesheet">
    <link href="https://js.arcgis.com/3.43/esri/themes/calcite/esri/esri.css" rel="stylesheet">
    <link href="https://js.arcgis.com/3.43/dijit/themes/claro/claro.css" rel="stylesheet">
    <link rel="stylesheet" href="https://js.arcgis.com/3.43/esri/css/esri.css">
    <style>
        /* 新增的样式 */
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-size:20px;
        }
        .viewport {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #csvTable {
            margin-top: -90px;
            color: white;
            width: 100%;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="viewport">
            <table id="csvTable" border="1">
            <!-- 表格的表头从CSV数据中获取 -->
            </table>

        <a href="/index"><button style="margin-top:800px;width:120px;height:60px;font-size:20px;background-color:transparent;color:white;">返回主页面</button></a>
    </div>

    <script>
        fetch('/data')
            .then(response => response.json())
            .then(data => {
                var thead = document.createElement('thead');
                var headerRow = document.createElement('tr');
                Object.keys(data[0]).forEach(function (key) {
                    var th = document.createElement('th');
                    var td = document.createTextNode(key);
                    th.appendChild(td);
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);

                var tbody = document.createElement('tbody');
                data.forEach(function (row) {
                    var tr = document.createElement('tr');
                    Object.values(row).forEach(function (item) {
                        var td = document.createElement('td');
                        td.appendChild(document.createTextNode(item));
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });

                document.getElementById('csvTable').appendChild(thead);
                document.getElementById('csvTable').appendChild(tbody);
            })
            .catch(error => {
                console.error('Error fetching data:', error);
            });
    </script>

    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/echarts.min.js"></script>
    <script src="/static/js/index.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="/static/js/china.js"></script>
    <script src="/static/js/mymap.js"></script>
    <script src="https://js.arcgis.com/3.43/"></script>
    <script src="/static/js/map.js"></script>
</body>

</html>
