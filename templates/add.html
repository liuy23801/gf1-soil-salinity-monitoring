<!DOCTYPE html>
<html lang="cn-zh">
<head>
    <meta charset="UTF-8">
    <title>数据添加</title>
</head>
<body>
<center>
    <form action="/adds/" method="post">
        <h1>添加采样点数据</h1>
        <table border="3px" width="400px" style="font-size:20px;">
            <tr>
                <td>Id:</td>
                <td><input type="text" name="Id" placeholder="例：20" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td>采样地:</td>
                <td><input type="text" name="采样地" placeholder="例：3孔雀河3" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td>有机质:</td>
                <td><input type="text" name="有机质" placeholder="例：18.139" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td>全氮:</td>
                <td><input type="text" name="全氮" placeholder="例：1015.3" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td>总磷:</td>
                <td><input type="text" name="总磷" placeholder="例：660.975" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td>含水率:</td>
                <td><input type="text" name="含水率" placeholder="例：257.26" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td>全钾量:</td>
                <td><input type="text" name="全钾量" placeholder="例：21.573" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td>水溶性盐:</td>
                <td><input type="text" name="水溶性盐_1" placeholder="0.441" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td>X:</td>
                <td><input type="text" name="X" placeholder="例：86.062862" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td>Y:</td>
                <td><input type="text" name="Y" placeholder="例：41.599026" style="width:200px;height:20px"><br></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" ,value="确定" style="width:60px;height:30px;"></td>
            </tr>

        </table>
    </form>
</center>
</body>
</html>
